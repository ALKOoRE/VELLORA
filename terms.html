        document.addEventListener('click', function (e) {
            const link = e.target.closest('a[href*="wa.me/"]');
            if (!link) return;
            e.preventDefault();
            const phone = '963930888475';
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                             (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
            if (isMobile) {
                const fb = setTimeout(() => { if (!document.hidden) location.href = 'https://api.whatsapp.com/send?phone=' + phone; }, 1800);
                document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(fb); }, { once: true });
                window.addEventListener('pagehide', () => clearTimeout(fb), { once: true });
                location.href = 'whatsapp://send?phone=' + phone;
            } else {
                const webUrl = 'https://web.whatsapp.com/send?phone=' + phone;
                let handled = false;
                const mark = () => { handled = true; };
                window.addEventListener('blur', mark, { once: true });
                document.addEventListener('visibilitychange', () => { if (document.hidden) handled = true; }, { once: true });
                location.href = 'whatsapp://send?phone=' + phone;
                setTimeout(() => {
                    window.removeEventListener('blur', mark);
                    if (handled || document.getElementById('wa-web-hint')) return;
                    const ar = document.documentElement.lang === 'ar';
                    const box = document.createElement('div');
                    box.id = 'wa-web-hint';
                    box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:92vw;background:#081B2E;color:#fff;border:1px solid #C49A52;border-radius:14px;padding:12px 16px;box-shadow:0 18px 50px -12px rgba(0,0,0,.55);font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center';

                    document.body.appendChild(box);
                    setTimeout(() => box.remove(), 15000);
                }, 3500);

                        'إرسال الطلب بنفسك إن كنت بالغاً، أو عبر وليّ الأمر إن كان المريض قاصراً أو غير قادر على التصرف.'] }] },
              en: { t: 'Your responsibilities', b: [
                    'So that we can serve you properly, we ask you to:',
                    { list: [
                        'Provide accurate and complete information and documents, and tell us about any change in your health or plans.',
                        'Make sure your passport and the documents required for travel and stay are valid.',
                        'Follow the instructions and appointment times of the doctors and hospitals.',
                        'Send the request yourself if you are an adult, or through a parent or legal guardian if the patient is a minor or unable to act.'] }] } },

            { id: 's5', icon: 'fa-solid fa-passport',
              ar: { t: 'التأشيرة والسفر', b: [
                    'نتكفل بإنجاز إجراءات التأشيرة الطبية والحصول على القبول لدى المستشفى المعالج نيابةً عنك، ونتابع طلبك معك خطوة بخطوة حتى اكتماله.'] },
              en: { t: 'Visas and travel', b: [
                    'We take care of completing your medical visa procedures and obtaining admission at the treating hospital on your behalf, and we follow your request with you step by step until it is complete.'] } },

            { id: 's6', icon: 'fa-solid fa-file-invoice-dollar',
              ar: { t: 'التكاليف والمدفوعات', b: [

                    'تختلف سياسات الإلغاء والاسترداد من مقدّم خدمة لآخر، ونبلغك بها قبل تأكيد الحجز.'] },
              en: { t: 'Costs and payments', b: [

                    'Cancellation and refund policies differ from one provider to another, and we tell you about them before a booking is confirmed.'] } },

            { id: 's7', icon: 'fa-solid fa-scale-balanced',
              ar: { t: 'النتائج الطبية وحدود المسؤولية', b: [
                    'تختلف نتائج العلاج من حالة لأخرى، ولا نضمن أي نتيجة طبية. القرارات العلاجية يتخذها الأطباء المعالجون بحسب حالتك.',
                    'نبذل العناية المعقولة في اختيار مقدّمي الخدمة والتنسيق معهم، ولا نتحمل المسؤولية عن أفعال أو إهمال أطراف مستقلة، ولا عن ظروف خارجة عن إرادتنا كإغلاق الحدود أو إلغاء الرحلات أو تأخرها، وذلك بالقدر الذي يسمح به القانون. ولا يمتد هذا إلى ما لا يجوز قانوناً استثناؤه.'] },
              en: { t: 'Medical outcomes and limits of liability', b: [
                    'Treatment results vary from case to case and we do not guarantee any medical outcome. Treatment decisions are made by the treating doctors according to your condition.',
                    'We take reasonable care in selecting and coordinating with providers. We are not responsible for the acts or omissions of independent parties, or for circumstances beyond our control such as border closures or cancelled or delayed travel, to the extent the law allows. This does not extend to anything that cannot lawfully be excluded.'] } },

            { id: 's8', icon: 'fa-solid fa-copyright',
              ar: { t: 'الاستخدام المقبول والملكية الفكرية', b: [
                    'محتوى الموقع من نصوص وتصميم وشعار ملك لـ VELLORA أو مرخّص لها، ولا يجوز نسخه أو إعادة نشره دون إذن مسبق.',
                    'يُمنع استخدام الموقع بطريقة مخالفة للقانون، أو إرسال معلومات كاذبة أو مضلّلة، أو محاولة تعطيل الموقع أو الوصول غير المصرّح به إليه.'] },
              en: { t: 'Acceptable use and intellectual property', b: [
                    'The website content, including text, design and logo, belongs to or is licensed to VELLORA and may not be copied or republished without prior permission.',
                    'You may not use the website unlawfully, send false or misleading information, or try to disrupt the website or gain unauthorised access to it.'] } },

            { id: 's9', icon: 'fa-solid fa-arrows-rotate',
              ar: { t: 'الخصوصية والتعديلات والتواصل', b: [
                    'نتعامل مع بياناتك وفق <a class="privacy-inline font-bold text-navy-900 underline decoration-gold-500 decoration-2 underline-offset-4 hover:text-gold-700" href="privacy.html">سياسة الخصوصية والسرية الطبية</a>.',
                    'قد نعدّل هذه الشروط من وقت لآخر، ويظهر تاريخ آخر تحديث أعلى الصفحة. استمرارك في استخدام الموقع بعد التعديل يعني موافقتك على النسخة الجديدة. تخضع هذه الشروط للقانون المعمول به، ونرحّب بالتواصل معنا أولاً لحل أي خلاف ودياً.',
                    { contact: true }] },
              en: { t: 'Privacy, changes and contact', b: [
                    'We handle your data according to our <a class="privacy-inline font-bold text-navy-900 underline decoration-gold-500 decoration-2 underline-offset-4 hover:text-gold-700" href="privacy.html">Privacy & Medical Confidentiality Policy</a>.',
                    'We may update these terms from time to time; the last-updated date appears at the top of the page. Continuing to use the website after a change means you accept the new version. These terms are governed by the applicable law, and we welcome you contacting us first so we can try to resolve any dispute amicably.',
                    { contact: true }] } }
        ];

        function renderBody(items, lang) {
            return items.map(it => {
                if (typeof it === 'string') return `<p class="text-sm sm:text-[15px] leading-8 text-slate-800">${it}</p>`;
                if (it.list) return `<ul class="space-y-2.5">${it.list.map(li => `
                    <li class="flex items-start gap-3 text-sm sm:text-[15px] leading-7 text-slate-800">
                        <i class="fa-solid fa-check mt-1.5 text-[10px] text-gold-600 shrink-0"></i><span>${li}</span>
                    </li>`).join('')}</ul>`;
                if (it.note) return `
                    <div class="flex items-start gap-3 rounded-2xl border border-gold-500/40 bg-gold-500/10 p-4">
                        <i class="fa-solid fa-circle-info mt-0.5 text-gold-600"></i>
                        <p class="text-sm leading-7 font-medium text-navy-900">${it.note}</p>
                    </div>`;
                if (it.contact) return `
                    <div class="rounded-2xl bg-navy-900 text-white p-5 sm:p-6 border border-gold-500/40 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-gold-400 text-base">${T[lang].contactTitle}</h3>
                            <p class="text-xs sm:text-sm text-stone-300 mt-1">${T[lang].contactText}</p>
                        </div>
                        <a href="${PHONE_LINK}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white text-sm font-semibold px-4 py-3 rounded-xl border border-emerald-400/30 shrink-0">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>${T[lang].contactBtn}</span>
                            <span class="font-en text-xs opacity-80" dir="ltr">${PHONE_DISPLAY}</span>
                        </a>
                    </div>`;
                return '';
            }).join('');
        }

        function render(lang) {
            currentLang = lang;
            const t = T[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.title = (lang === 'ar' ? 'الشروط والأحكام | VELLORA فيلورا' : 'Terms & Conditions | VELLORA');

            document.getElementById('lang-btn-label').textContent = t.langBtn;
            document.getElementById('back-text').textContent = t.back;
            document.getElementById('page-title').textContent = t.title;
            document.getElementById('page-lead').textContent = t.lead;
            document.getElementById('updated-text').textContent = t.updated;
            document.getElementById('toc-title').textContent = t.toc;
            document.getElementById('footer-copy').textContent = t.copy;
            document.getElementById('footer-back-text').textContent = t.backHome;
            document.getElementById('footer-privacy').textContent = t.privacy;
            ['brand-link', 'back-link', 'footer-back'].forEach(id => { document.getElementById(id).href = 'index.html?lang=' + lang; });
            document.getElementById('footer-privacy').href = 'privacy.html?lang=' + lang;

            document.getElementById('glance-grid').innerHTML = glance.map(g => `
                <div class="glass-card-light rounded-3xl p-5 shadow-xl text-center space-y-3">
                    <div class="mx-auto w-12 h-12 rounded-2xl bg-navy-900 border border-gold-500/50 flex items-center justify-center text-gold-400 text-xl"><i class="${g.icon}"></i></div>
                    <h3 class="font-extrabold text-navy-900 text-base">${g[lang][0]}</h3>
                    <p class="text-xs sm:text-[13px] leading-6 text-slate-700">${g[lang][1]}</p>
                </div>`).join('');

            document.getElementById('toc-list').innerHTML = sections.map((s, i) => `
                <li><a href="#${s.id}" data-toc="${s.id}" class="toc-link flex items-center gap-3 rounded-xl px-3 py-2 text-[13px] text-slate-700 hover:bg-gold-500/10">
                    <span class="font-en text-[11px] font-bold text-gold-600 w-5">${String(i + 1).padStart(2, '0')}</span>
                    <span>${s[lang].t}</span></a></li>`).join('');

            document.getElementById('sections').innerHTML = sections.map((s, i) => `
                <section id="${s.id}" class="scroll-mt-28 glass-card-light rounded-3xl p-6 sm:p-8 shadow-sm relative overflow-hidden">
                    <span class="font-en absolute top-3 ltr:right-5 rtl:left-5 text-6xl sm:text-7xl font-extrabold text-gold-500/15 select-none pointer-events-none">${String(i + 1).padStart(2, '0')}</span>
                    <div class="flex items-center gap-3 mb-4 relative">
                        <div class="w-11 h-11 rounded-2xl bg-navy-900 border border-gold-500/40 flex items-center justify-center text-gold-400 shrink-0"><i class="${s.icon}"></i></div>
                        <h2 class="text-lg sm:text-xl font-extrabold text-navy-900">${s[lang].t}</h2>
                    </div>
                    <div class="space-y-4 relative">${renderBody(s[lang].b, lang)}</div>
                </section>`).join('');
            document.querySelectorAll('.privacy-inline').forEach(a => { a.href = 'privacy.html?lang=' + lang; });
            observeSections();
        }

        function toggleLanguage() { render(currentLang === 'ar' ? 'en' : 'ar'); }

        // highlight the current section in the table of contents
        let io;
        function observeSections() {
            if (io) io.disconnect();
            io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        document.querySelectorAll('.toc-link').forEach(a => a.classList.toggle('active', a.dataset.toc === e.target.id));
                    }
                });
            }, { rootMargin: '-25% 0px -65% 0px' });
            document.querySelectorAll('#sections section').forEach(el => io.observe(el));
        }

        window.onload = function () {
            const q = new URLSearchParams(location.search).get('lang');
            render(q === 'en' ? 'en' : 'ar');
        };
    </script>
</body>
</html>
