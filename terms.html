<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="ivory" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشروط والأحكام | VELLORA فيلورا</title>

    <meta name="description" content="الشروط والأحكام لاستخدام موقع VELLORA فيلورا وخدمات التنسيق الطبي والسفر العلاجي إلى بريطانيا: طبيعة الخدمة، الحجز، التأشيرة، التكاليف، والمسؤولية.">
    <meta name="theme-color" content="#FBF7EB" id="meta-theme-color">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VELLORA">
    <meta property="og:title" content="الشروط والأحكام | VELLORA فيلورا">
    <meta property="og:description" content="الشروط والأحكام لخدمات التنسيق الطبي والسفر العلاجي إلى بريطانيا لدى VELLORA فيلورا.">
    <meta property="og:image" content="vellora-footer-banner.jpg">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:locale:alternate" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts: Amiri & IBM Plex Sans Arabic (AR) + Cormorant Garamond & Plus Jakarta Sans (EN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6.4.0 (CSS + defer JS inline SVG fallback for mobile previews) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Restore Saved Theme Before Paint & Graceful Asset Fallbacks -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('vellora-theme');
                if (saved === 'midnight' || saved === 'ivory') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();

        // Graceful inline SVG fallback when local ornament image is unavailable in sandbox preview
        function handleOrnamentError(imgEl) {
            try {
                if (!imgEl) return;
                imgEl.style.display = 'none';
                var fb = imgEl.parentElement && imgEl.parentElement.querySelector('.ornament-fallback');
                if (fb) fb.classList.remove('hidden');
            } catch (e) {}
        }

        // Graceful inline SVG fallback when local vellora-logo.jpg is unavailable in sandbox preview
        function handleCenterLogoError(imgEl) {
            try {
                if (!imgEl) return;
                imgEl.style.display = 'none';
                var fb = imgEl.parentElement && imgEl.parentElement.querySelector('.center-logo-fallback');
                if (fb) fb.classList.remove('hidden');
            } catch (e) {}
        }
    </script>

    <style>
        /* =========================================================
           1. DUAL THEME SYSTEM (QUIET LUXURY IVORY & MIDNIGHT EDITORIAL)
              Exact 1:1 token parity with index.html & privacy.html
           ========================================================= */
        :root,
        [data-theme="ivory"] {
            --bg-canvas: #FBF7EB;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F3EDE0;
            --bg-ribbon: rgba(251, 247, 235, 0.95);
            --bg-band: #081B2E;
            --text-band: #F7F3EA;
            --text-band-muted: #B8C4D1;

            --text-main: #081B2E;
            --text-secondary: #3E4C5E;
            --text-muted: #6A7685;

            --gold: #9E742E;
            --gold-bright: #C49A52;
            --gold-soft: rgba(196, 154, 82, 0.13);

            --border-line: rgba(8, 27, 46, 0.12);
            --border-gold: rgba(166, 124, 55, 0.38);

            --btn-primary-bg: #081B2E;
            --btn-primary-text: #FBF7EB;
            --btn-primary-hover: #112E4B;

            --shadow-soft: 0 20px 48px -28px rgba(8, 27, 46, 0.16);
            --drawer-bg: rgba(251, 247, 235, 0.98);
            --sticky-bar-bg: rgba(251, 247, 235, 0.96);
        }

        [data-theme="midnight"] {
            --bg-canvas: #061321;
            --bg-surface: #0C1F34;
            --bg-subtle: #091829;
            --bg-ribbon: rgba(6, 19, 33, 0.95);
            --bg-band: #0E2640;
            --text-band: #F7F3EA;
            --text-band-muted: #BDC8D6;

            --text-main: #F7F3EA;
            --text-secondary: #CBD4DF;
            --text-muted: #93A2B4;

            --gold: #D4AF37;
            --gold-bright: #E8C975;
            --gold-soft: rgba(212, 175, 55, 0.14);

            --border-line: rgba(247, 243, 234, 0.12);
            --border-gold: rgba(212, 175, 55, 0.38);

            --btn-primary-bg: #D4AF37;
            --btn-primary-text: #061321;
            --btn-primary-hover: #E6C75E;

            --shadow-soft: 0 24px 56px -22px rgba(0, 0, 0, 0.65);
            --drawer-bg: rgba(8, 23, 40, 0.98);
            --sticky-bar-bg: rgba(6, 19, 33, 0.96);
        }

        /* =========================================================
           2. BASE TYPOGRAPHY & SEMANTIC COLOR UTILITIES
           ========================================================= */
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease;
            overflow-x: hidden;
            font-variant-numeric: lining-nums tabular-nums;
        }
        html[lang="en"] body {
            font-family: 'Plus Jakarta Sans', 'IBM Plex Sans Arabic', sans-serif;
        }
        html[lang="ar"] body :not([dir="ltr"]):not([dir="ltr"] *) {
            letter-spacing: normal;
        }

        .font-display {
            font-family: 'Amiri', serif;
            font-weight: 700;
        }
        html[lang="en"] .font-display {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }
        .font-en { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-en { font-family: 'Cormorant Garamond', serif; }

        .bg-canvas { background-color: var(--bg-canvas); }
        .bg-surface { background-color: var(--bg-surface); }
        .bg-subtle { background-color: var(--bg-subtle); }
        .bg-band { background-color: var(--bg-band); color: var(--text-band); }

        .text-main { color: var(--text-main); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .text-gold { color: var(--gold); }
        .text-band-muted { color: var(--text-band-muted); }

        .border-hairline { border-color: var(--border-line); }
        .border-gold-line { border-color: var(--border-gold); }

        html[dir="rtl"] .dir-ltr-only { display: none; }
        html[dir="ltr"] .dir-rtl-only { display: none; }

        /* =========================================================
           3. MATHEMATICALLY FIXED 3-LAYER SEAMLESS BANNER ARCHITECTURE
              Shared identically by .vellora-header-banner & .vellora-footer-banner
           ========================================================= */
        .vellora-header-banner,
        .vellora-footer-banner {
            position: relative;
            width: 100%;
            height: var(--bar-h);
            background: linear-gradient(90deg, #EFE3CD 0%, #F6EEE0 18%, #FBF7EB 38%, #FBF7EB 62%, #F6EEE0 82%, #EFE3CD 100%);
            border-bottom: 1px solid rgba(196, 154, 82, 0.55);
            overflow: hidden;
        }

        .vellora-header-banner {
            --bar-h: 74px;
            box-shadow: 0 10px 30px -16px rgba(6, 19, 33, 0.32);
        }
        @media (min-width: 640px) {
            .vellora-header-banner { --bar-h: 96px; }
        }

        .vellora-footer-banner {
            --bar-h: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (min-width: 640px) {
            .vellora-footer-banner { --bar-h: 130px; }
        }

        /* Subtle golden filigree arcs spanning across the parchment base */
        .banner-filigree-arcs {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.28;
            pointer-events: none;
            z-index: 0;
        }

        /* Strictly cropped outer corner ornament slots (width = 0.50 * H) */
        .ornament-slot {
            position: absolute;
            top: 0;
            bottom: 0;
            width: calc(var(--bar-h) * 0.50);
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .ornament-left {
            left: 0;
            -webkit-mask-image: linear-gradient(to right, #000 68%, transparent 100%);
            mask-image: linear-gradient(to right, #000 68%, transparent 100%);
        }
        .ornament-right {
            right: 0;
            -webkit-mask-image: linear-gradient(to left, #000 68%, transparent 100%);
            mask-image: linear-gradient(to left, #000 68%, transparent 100%);
        }
        .ornament-slot img {
            position: absolute;
            top: -9%;
            height: 118%;
            width: auto;
            max-width: none;
            display: block;
        }
        .ornament-left img { left: 0; }
        .ornament-right img { right: 0; }

        .ornament-fallback {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Single seamless center logo blended onto #FBF7EB parchment */
        .banner-center-logo {
            height: calc(var(--bar-h) - 14px);
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply;
            display: block;
        }
        .vellora-footer-banner .banner-center-logo {
            height: calc(var(--bar-h) - 18px);
        }

        /* =========================================================
           4. BALANCED HEADER BUTTON CLUSTER & THIN DESKTOP NAV STRIP
           ========================================================= */
        .header-center-cluster {
            position: relative;
            z-index: 10;
            height: 100%;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding-inline: calc(var(--bar-h) * 0.56);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0.5rem;
        }
        @media (min-width: 640px) {
            .header-center-cluster { gap: 1.25rem; }
        }
        @media (min-width: 1024px) {
            .header-center-cluster { gap: 2rem; }
        }

        .hdr-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border-radius: 9999px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .hdr-pill:hover { transform: translateY(-1px); }

        .hdr-pill-navy {
            background-color: #081B2E;
            color: #FBF7EB;
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 5px 14px -6px rgba(6, 19, 33, 0.5);
        }
        .hdr-pill-navy:hover {
            background-color: #102B48;
            border-color: #E8C975;
        }

        .hdr-pill-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B88B38 100%);
            color: #081B2E;
            border: 1px solid rgba(139, 99, 33, 0.65);
            box-shadow: 0 6px 16px -6px rgba(139, 99, 33, 0.55);
        }
        .hdr-pill-gold:hover {
            background: linear-gradient(135deg, #E2BE4A 0%, #C69841 100%);
        }

        .hdr-pill-wa {
            background-color: #0F7A3A;
            color: #FFFFFF;
            border: 1px solid rgba(110, 231, 160, 0.45);
            box-shadow: 0 6px 16px -6px rgba(15, 122, 58, 0.55);
        }
        .hdr-pill-wa:hover {
            background-color: #139146;
        }

        .desktop-nav-ribbon {
            background-color: var(--bg-canvas);
            border-bottom: 1px solid var(--border-line);
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }

        #mobile-menu {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            background-color: var(--drawer-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        #mobile-menu.is-open {
            grid-template-rows: 1fr;
            border-bottom: 1px solid var(--border-gold);
            box-shadow: 0 20px 44px -16px rgba(6, 19, 33, 0.45);
        }
        .accordion-inner { overflow: hidden; min-height: 0; }

        /* =========================================================
           5. EDITORIAL LEGAL DOSSIER COMPONENTS
           ========================================================= */
        .btn-editorial {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: 1px solid var(--btn-primary-bg);
            border-radius: 6px;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .btn-editorial:hover {
            background-color: var(--btn-primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline-editorial {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .btn-outline-editorial:hover {
            background-color: var(--gold-soft);
            border-color: var(--gold);
        }

        .btn-whatsapp {
            background-color: #137A46;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .btn-whatsapp:hover {
            background-color: #179254;
            transform: translateY(-1px);
        }

        .arch-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-line);
            border-radius: 8px;
            box-shadow: var(--shadow-soft);
            transition: border-color 0.3s ease, background-color 0.35s ease;
        }
        .arch-card:hover { border-color: var(--border-gold); }

        /* TOC Link Active Highlight */
        .toc-link {
            color: var(--text-secondary);
            border-radius: 6px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .toc-link:hover {
            background-color: var(--gold-soft);
            color: var(--text-main);
        }
        .toc-link.active {
            color: var(--gold);
            background-color: var(--gold-soft);
            font-weight: 700;
        }

        /* Editorial Note Callout */
        .dossier-note {
            background-color: var(--gold-soft);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
        }

        /* Subtle Icon Badge */
        .icon-badge {
            background-color: var(--gold-soft);
            border: 1px solid var(--border-gold);
            color: var(--gold);
        }

        /* Mobile Sticky Bottom Action Bar */
        .mobile-sticky-bar {
            background-color: var(--sticky-bar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-gold);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mobile-sticky-bar.is-visible { transform: translateY(0); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: var(--bg-canvas); }
        ::-webkit-scrollbar-thumb { background: var(--gold-bright); }
    
        /* Smooth scroll-linked header fade before footer */
        .site-header {
            will-change: transform, opacity;
            transition: opacity 0.12s linear, transform 0.12s linear;
        }

        /* Responsive compact sizing for unified 4-button header on small mobile screens */
        @media (max-width: 639px) {
            .header-center-cluster {
                padding-inline: calc(var(--bar-h) * 0.44);
                gap: 0.3rem;
            }
            .hdr-pill {
                gap: 0.22rem;
                padding-inline: 0.45rem !important;
                height: 28px !important;
                font-size: 10px !important;
            }
            .hdr-pill i {
                font-size: 10px !important;
            }
            .vellora-header-banner .banner-center-logo {
                height: calc(var(--bar-h) - 22px);
                max-width: 82px;
            }
        }

        /* Editorial Scroll-Spy / Horizontal Scrollable Nav Rail (Mobile + Desktop) */
        .editorial-nav-rail {
            background-color: var(--bg-ribbon);
            border-bottom: 1px solid rgba(166, 124, 55, 0.28);
            transition: background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            position: relative;
        }
        [data-theme="midnight"] .editorial-nav-rail {
            border-bottom: 1px solid rgba(212, 175, 55, 0.24);
            box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.65);
        }
        .editorial-nav-track {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.35rem;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0.38rem 0.85rem;
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
        }
        .editorial-nav-track::-webkit-scrollbar {
            display: none;
        }
        @media (min-width: 768px) {
            .editorial-nav-track {
                justify-content: center;
                gap: 0.5rem;
                padding: 0.42rem 1rem;
                -webkit-mask-image: none;
                mask-image: none;
            }
        }
        .nav-rail-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.32rem 0.72rem;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            scroll-snap-align: center;
            color: var(--text-secondary);
            border: 1px solid transparent;
            transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, transform 0.2s ease;
            flex-shrink: 0;
        }
        .nav-rail-pill i {
            font-size: 10px;
            color: var(--gold);
            opacity: 0.82;
            transition: opacity 0.2s ease;
        }
        .nav-rail-pill:hover {
            color: var(--gold);
            background-color: var(--gold-soft);
        }
        .nav-rail-pill.is-active {
            color: var(--gold);
            background-color: var(--gold-soft);
            border-color: var(--border-gold);
            font-weight: 700;
        }
        .nav-rail-pill.is-active i {
            opacity: 1;
        }
    </style>
</head>

         1. FIXED 3-LAYER SEAMLESS HEADER BANNER (IDENTICAL TO index.html)
         ========================================================= -->

            </div>

            <!-- Layer 2b: Far-Right Corner Ornament -->
            <div class="ornament-slot ornament-right" aria-hidden="true">
                <img src="vellora-footer-banner.jpg" alt="" fetchpriority="high" onerror="handleOrnamentError(this)">
                <svg class="ornament-fallback hidden" viewBox="0 0 120 200" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="hdrOrnGoldR" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#9E742E"/><stop offset="50%" stop-color="#E8C975"/><stop offset="100%" stop-color="#7D5A1C"/>

                    </defs>

        function renderBody(items, lang) {
            return items.map(function (it) {
                if (typeof it === 'string') {
                    return `<p class="text-sm sm:text-[15px] leading-8 text-secondary">${it}</p>`;
                }
                if (it.list) {
                    return `<ul class="space-y-2.5">${it.list.map(function (li) {
                        return `<li class="flex items-start gap-3 text-sm sm:text-[15px] leading-7 text-secondary">
                            <i class="fa-solid fa-check mt-2 text-[10px] text-gold shrink-0"></i>
                            <span>${li}</span>
                        </li>`;
                    }).join('')}</ul>`;
                }
                if (it.note) {
                    return `<div class="dossier-note flex items-start gap-3 p-4">
                        <i class="fa-solid fa-circle-info mt-1 text-gold shrink-0"></i>
                        <p class="text-sm leading-7 font-medium text-main">${it.note}</p>
                    </div>`;
                }
                if (it.contact) {
                    return `<div class="bg-band border border-gold-line rounded-md p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="space-y-1">
                            <h3 class="font-display text-xl text-[#F7F3EA]">${T[lang].contactTitle}</h3>
                            <p class="text-xs sm:text-sm text-band-muted">${T[lang].contactText}</p>
                        </div>
                        <a href="${PHONE_LINK}" target="_blank" rel="noopener" class="btn-whatsapp inline-flex items-center justify-center gap-2 text-xs sm:text-sm font-bold px-4 py-3 shrink-0">
                            <i class="fa-brands fa-whatsapp text-lg"></i>

                        </a>
                    </div>`;
                }
                return '';
            }).join('');
        }

        /* ---------------- BILINGUAL PAGE RENDER ---------------- */
        function render(lang) {
            currentLang = lang;
            const t = T[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.title = t.pageTitle;

            // Header buttons & labels
            document.getElementById('lang-btn-label').textContent = t.langBtn;
            document.getElementById('back-text').textContent = t.back;
            document.getElementById('hdr-wa-label').textContent = t.hdrWa;
            document.getElementById('sticky-home-text').textContent = t.back;
            document.getElementById('sticky-wa-text').textContent = t.mmWa;
            updateThemeButtonUI();

            // Sync all navigation links with active ?lang= parameter
            const homeUrl = 'index.html?lang=' + lang;
            const privacyUrl = 'privacy.html?lang=' + lang;

            ['brand-link', 'back-link', 'crumb-home', 'footer-logo-link', 'footer-back', 'sticky-home-link'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.href = homeUrl;
            });

            document.getElementById('crumb-home').textContent = t.crumbHome;
            document.getElementById('crumb-current').textContent = t.crumbCurrent;

            // Editorial Nav Rail links (preserving icons inside <a>)
            document.getElementById('nav-text-leadership').textContent = t.navLeadership;
            document.getElementById('nav-link-leadership').href = homeUrl + '#leadership';
            document.getElementById('nav-text-centers').textContent = t.navCenters;
            document.getElementById('nav-link-centers').href = homeUrl + '#centers';
            document.getElementById('nav-text-studio').textContent = t.navStudio;
            document.getElementById('nav-link-studio').href = homeUrl + '#studio';
            document.getElementById('nav-text-privacy').textContent = t.navPrivacy;
            document.getElementById('nav-link-privacy').href = privacyUrl;
            document.getElementById('nav-link-terms').textContent = t.navTerms;

            // Hero, TOC & Sidebar Cross-Link Card
            document.getElementById('page-title').textContent = t.title;
            document.getElementById('page-lead').textContent = t.lead;
            document.getElementById('updated-text').textContent = t.updated;
            document.getElementById('toc-title').textContent = t.toc;

            const spCard = document.getElementById('sidebar-privacy-card');
            spCard.href = privacyUrl;
            document.getElementById('sidebar-privacy-kicker').textContent = t.sidebarPrivKicker;
            document.getElementById('sidebar-privacy-title').textContent = t.sidebarPrivTitle;
            document.getElementById('sidebar-privacy-desc').textContent = t.sidebarPrivDesc;

            // At-a-Glance 4 cards
            document.getElementById('glance-grid').innerHTML = glance.map(function (g) {
                return `<div class="arch-card p-5 sm:p-6 text-center space-y-3">
                    <div class="mx-auto w-11 h-11 rounded-md icon-badge flex items-center justify-center text-lg">
                        <i class="${g.icon}"></i>
                    </div>
                    <h3 class="font-bold text-main text-base">${g[lang][0]}</h3>
                    <p class="text-xs sm:text-[13px] leading-6 text-secondary">${g[lang][1]}</p>
                </div>`;
            }).join('');

            // TOC list
            document.getElementById('toc-list').innerHTML = sections.map(function (s, i) {
                return `<li>
                    <a href="#${s.id}" data-toc="${s.id}" class="toc-link flex items-center gap-3 px-3 py-2 text-[13px]">
                        <span class="font-en text-[11px] font-bold text-gold w-5 shrink-0">${String(i + 1).padStart(2, '0')}</span>
                        <span>${s[lang].t}</span>
                    </a>
                </li>`;
            }).join('');

            // 9 Legal Dossier Clauses
            document.getElementById('sections').innerHTML = sections.map(function (s, i) {
                return `<section id="${s.id}" class="scroll-mt-36 arch-card p-6 sm:p-8 relative overflow-hidden">
                    <span class="font-serif-en absolute top-3 ltr:right-5 rtl:left-5 text-6xl sm:text-7xl font-bold text-gold opacity-10 select-none pointer-events-none">${String(i + 1).padStart(2, '0')}</span>
                    <div class="flex items-center gap-3.5 pb-4 mb-5 border-b border-hairline relative">
                        <div class="w-10 h-10 rounded-md icon-badge flex items-center justify-center shrink-0">
                            <i class="${s.icon}"></i>
                        </div>
                        <h2 class="font-display text-xl sm:text-2xl text-main">${s[lang].t}</h2>
                    </div>
                    <div class="space-y-4 relative">${renderBody(s[lang].b, lang)}</div>
                </section>`;
            }).join('');

            // Ensure inline privacy link stays synchronized with language
            document.querySelectorAll('.privacy-inline').forEach(function (a) {
                a.href = privacyUrl;
            });

            // Footer text & synced links
            document.getElementById('footer-about-title').textContent = t.footerAboutTitle;
            document.getElementById('footer-bio').textContent = t.footerBio;
            document.getElementById('footer-quick-links-title').textContent = t.footerLinksTitle;
            document.getElementById('footer-contact-title').textContent = t.footerContactTitle;
            document.getElementById('footer-location').textContent = t.footerLocation;

            const fLead = document.getElementById('footer-link-leadership');
            fLead.textContent = t.footerLinkLeadership; fLead.href = homeUrl + '#leadership';
            const fCen = document.getElementById('footer-link-centers');
            fCen.textContent = t.footerLinkCenters; fCen.href = homeUrl + '#centers';
            const fJrn = document.getElementById('footer-link-journey');
            fJrn.textContent = t.footerLinkJourney; fJrn.href = homeUrl + '#journey';
            const fStu = document.getElementById('footer-link-studio');
            fStu.textContent = t.footerLinkStudio; fStu.href = homeUrl + '#studio';
            const fFaq = document.getElementById('footer-link-faq');
            fFaq.textContent = t.footerLinkFaq; fFaq.href = homeUrl + '#faq';

            document.getElementById('footer-copy').textContent = t.copy;
            const fp = document.getElementById('footer-privacy');
            fp.textContent = t.privacy; fp.href = privacyUrl;
            document.getElementById('footer-back-text').textContent = t.backHome;

            observeSections();
        }

        function toggleLanguage() {
            render(currentLang === 'ar' ? 'en' : 'ar');
        }

        /* ---------------- INTERSECTION OBSERVER FOR ACTIVE TOC ---------------- */
        let io;
        function observeSections() {
            if (io) io.disconnect();
            if (!('IntersectionObserver' in window)) return;
            io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) {
                        document.querySelectorAll('.toc-link').forEach(function (a) {
                            a.classList.toggle('active', a.dataset.toc === e.target.id);
                        });
                    }
                });
            }, { rootMargin: '-25% 0px -65% 0px' });
            document.querySelectorAll('#sections section').forEach(function (el) { io.observe(el); });
        }

        /* ---------------- INITIALIZE ON LOAD ---------------- */
        window.onload = function () {
            applyTheme(currentTheme);
            const q = new URLSearchParams(location.search).get('lang');
            render(q === 'en' ? 'en' : 'ar');
        };
    
        /* ---------------- CENTER ACTIVE NAV RAIL PILL ON MOBILE ---------------- */
        (function centerActiveNavRailPill() {
            function align() {
                var track = document.getElementById('editorial-nav-track');
                var active = track && track.querySelector('.nav-rail-pill.is-active');
                if (track && active && track.scrollWidth > track.clientWidth) {
                    var targetLeft = active.offsetLeft - (track.clientWidth - active.offsetWidth) / 2;
                    try { track.scrollTo({ left: targetLeft, behavior: 'auto' }); } catch (e) { track.scrollLeft = targetLeft; }
                }
            }
            window.addEventListener('load', align);
            window.addEventListener('resize', align, { passive: true });
            align();
        })();

        /* ---------------- GRADUAL HEADER HIDE BEFORE FOOTER ---------------- */
        (function initHeaderFooterFade() {
            var FADE_START_PX = 80;   // Start fading out 80px before footer enters viewport
            var FADE_END_PX = -140;   // Complete fade out smoothly right as footer logo appears
            var ticking = false;

            function updateHeaderVisibility() {
                ticking = false;
                var header = document.querySelector('.site-header');
                var footer = document.querySelector('footer');
                if (!header || !footer) return;

                var distanceToFooter = footer.getBoundingClientRect().top - window.innerHeight;
                var progress = 0;

                if (distanceToFooter <= FADE_END_PX) {
                    progress = 1;
                } else if (distanceToFooter < FADE_START_PX) {
                    progress = (FADE_START_PX - distanceToFooter) / (FADE_START_PX - FADE_END_PX);
                }

                // Smoothstep easing for gradual, natural disappearance
                var eased = progress * progress * (3 - 2 * progress);

                header.style.opacity = String(1 - eased);
                header.style.transform = 'translate3d(0, ' + (-eased * 100) + '%, 0)';

                if (eased >= 0.98) {
                    header.style.pointerEvents = 'none';
                    header.setAttribute('aria-hidden', 'true');
                } else {
                    header.style.pointerEvents = '';
                    header.removeAttribute('aria-hidden');
                }
            }

            function onScrollOrResize() {
                if (!ticking) {
                    ticking = true;
                    window.requestAnimationFrame(updateHeaderVisibility);
                }
            }

            window.addEventListener('scroll', onScrollOrResize, { passive: true });
            document.addEventListener('scroll', onScrollOrResize, { passive: true });
            window.addEventListener('resize', onScrollOrResize, { passive: true });
            window.addEventListener('load', updateHeaderVisibility);
            updateHeaderVisibility();
        })();
    </script>
